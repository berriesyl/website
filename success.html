<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teşekkürler — Berra Söyler</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .thanks{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .thanks .card{max-width:480px;background:var(--surface);border:1px solid var(--border-strong);border-radius:24px;padding:44px 32px;box-shadow:var(--shadow-lg);}
  .thanks .check{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--berry-500),var(--berry-700));display:flex;align-items:center;justify-content:center;}
  .thanks .check svg{width:30px;height:30px;color:#fff;}
  .thanks p{color:var(--text-dim);margin:0 0 26px;}
</style>
</head>
<body>
<main class="thanks">
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h2 class="lang-tr">Mesajınız iletildi!</h2>
    <h2 class="lang-en">Message sent!</h2>
    <p><span class="lang-tr">Teşekkürler, en kısa sürede size dönüş yapacağım.</span><span class="lang-en">Thank you, I'll get back to you as soon as possible.</span></p>
    <a href="/" class="btn btn-primary"><span class="lang-tr">Ana sayfaya dön</span><span class="lang-en">Back to home</span></a>
  </div>
</main>
<script>
  try { var l = localStorage.getItem('lang'); if (l === 'en' || l === 'tr') document.documentElement.lang = l; } catch (e) {}
</script>
</body>
</html>
